name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            system/requirements/*.txt

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libyaml-dev python3-dev

      - name: Install dependencies (with constraints)
        run: |
          pip install --upgrade pip
          pip install -r system/requirements/dev.txt \
            --constraint system/requirements/constraints.txt \
            --prefer-binary

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/server
          NERON_ROOT: ${{ github.workspace }}
          NERON_CONFIG: ${{ github.workspace }}/neron.yaml
        run: pytest -q --disable-warnings
