[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neronos"
version = "0.1.0"
description = "NéronOS internal Python packages"
requires-python = ">=3.11"

[project.scripts]
neron = "common.cli:main"

[tool.setuptools.packages.find]
where = ["server"]
# Doit rester aligne sur les repertoires de server/.
# "providers*" a ete retire (server/providers n a jamais existe) ; les services
# ajoutes depuis (doctor, print, watchdog) sont declares.
include = [
    "agents*",
    "common*",
    "core*",
    "doctor*",
    "goal*",
    "integrations*",
    "llm*",
    "memory*",
    "modules*",
    "print*",
    "tools*",
    "voice*",
    "watchdog*",
]
exclude = ["core.core*"]
namespaces = true
