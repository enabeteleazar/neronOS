[pytest]
testpaths =
    tests
    core/tests

norecursedirs =
    .git
    venv
    .venv
    runtime
    runtime/workspace/tools/tests
    workspace
    system/scripts/kdeps
    web
    node_modules
    __pycache__

python_files =
    test_*.py

asyncio_mode = auto

markers =
    slow: test lourd (sous-processus reels, bac a sable d agent, pytest imbriqué).
        Exclu par defaut. Pour les jouer : pytest -m slow

# Par defaut on ne joue que la suite rapide. `-m slow` en ligne de commande
# remplace ce filtre (le dernier -m gagne), donc `pytest -m slow` fonctionne.
addopts = -m "not slow"
