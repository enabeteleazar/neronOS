# ═══════════════════════════════════════════════════════════════════
# NERONOS - Infrastructure
#
# Décrit uniquement la topologie du cluster.
# Aucune clé API et aucun paramètre métier.
# ═══════════════════════════════════════════════════════════════════

cluster:
  enabled: true
  name: homebox-lab

nodes:

  core:
    host: 127.0.1.1
    bind: 0.0.0.0
    port: 8010

  llm:
    host: 127.0.1.2
    port: 8765

  goal:
    host: 127.0.1.3
    port: 8030

  memory:
    host: 127.0.1.4
    port: 8040

  voice:
    host: 127.0.1.5
    stt_port: 8045
    ui_port: 8082

  print:
    host: 127.0.1.7
    port: 8050

  doctor:
    host: 127.0.1.9
    port: 8060

  homeassistant:
    host: 127.0.1.6
    port: 8123

  watchdog:
    host: 127.0.1.6
    port: 8003

  searxng:
    host: 127.0.1.6
    port: 8080

# ==================================================================
# Réseau HTTP
# ==================================================================
#
# Il n'y a volontairement plus de section `server:` ici. Elle existait en
# double avec celle de neron.yaml, avec des valeurs divergentes, alors
# qu'aucun composant ne la lisait : seule la section `nodes` ci-dessus est
# consommée (common/serve.py, core/pipeline/goal_client.py,
# core/modules/self_model/homelab.py).
#
# Le bind et le port du Core viennent de `nodes.core` (bind/port).
# Les origines CORS viennent de neron.yaml, section `server:`.
