# ═══════════════════════════════════════════════════════════════════
# NERONOS - Configuration fonctionnelle
#
# Ce fichier contient uniquement la configuration du comportement
# de Néron. Aucune information d'infrastructure ou de secret.
#
# Infrastructure : neron.server.yaml
# Secrets        : secrets.env
# ═══════════════════════════════════════════════════════════════════

paths:
  root: .

config:
  server_override: neron.server.yaml

# ==================================================================
# SERVICES
# ==================================================================

neron_llm:
  enabled: true
  timeout: 120
  retry: 2

memory:
  enabled: true
  timeout: 10
  retry: 2

gateways:
  enabled: true
  timeout: 10
  retry: 2

# ==================================================================
# LLM
# ==================================================================

llm:
  # Provider utilisé si une tâche ci-dessous n'a pas de config valide
  # (absente, provider hors liste blanche, ou pas encore implémenté).
  # NE JAMAIS mettre autre chose qu'ollama ici — c'est le filet de
  # sécurité qui garantit qu'aucune génération ne part vers l'extérieur
  # par défaut, même si la config ci-dessous est cassée ou incomplète.
  safety_floor_provider: ollama

  # Liste blanche des providers utilisables, tous usages confondus.
  # Un provider absent de cette liste est ignoré par le routeur, quelle
  # que soit la config d'une tâche individuelle.
  #   - ollama : actif, utilisé aujourd'hui.
  #   - claude, codex : préparés pour un usage futur, PAS utilisés
  #     aujourd'hui. codex n'a d'ailleurs pas encore de code Provider —
  #     le sélectionner retombe automatiquement sur le plancher.
  providers_allowed:
    - ollama
    - llama_cpp
    - claude
    - codex

  default_provider: ollama

  # Modele utilise par Core quand aucune tache ne s'applique (agents montes au
  # demarrage : core/app.py -> LLMConfig(model=settings.OLLAMA_MODEL)).
  # Cette cle etait ABSENTE : core/config.py retombait alors sur son defaut
  # code en dur `llama3.2:1b`, un modele qui n'est PAS installe sur cette
  # machine. Ollama se rabattait donc sur le premier modele disponible
  # (qwen3.5:4b, 3,4 Go) et chaque appel partait en ReadTimeout.
  model: qwen3:1.7b

  # Timeout d'un appel a Ollama. Etait 300 s (600 s avec les retries), soit
  # plus que le timeout de Core : Core abandonnait pendant que le LLM
  # calculait encore. Ramene a 45 s, puis porte a 120 s le 04/09/2026 : le
  # juge memoire recoit un prompt d'environ 1000 caracteres et doit rendre un
  # JSON de triplets ; a 45 s il expirait systematiquement et plus aucun fait
  # n'etait extrait des conversations.
  # Ce plafond n'est pas une cible : une reponse de conversation revient en
  # 10 a 30 s. Il ne mord que sur les generations reellement longues.
  timeout: 120
  race_timeout: 30

  # Durée pendant laquelle Ollama garde un modèle chargé en RAM après une
  # génération, avant de le décharger. Défaut Ollama = 5m — trop court
  # pour un usage conversationnel : chaque silence > 5 min entraîne un
  # rechargement à froid (~10-30s de pénalité selon la taille du modèle,
  # observé en prod sur Homebox).
  #
  # Fixé à 10m plutôt que plus long : Homebox tourne à 7.2 Gi RAM totale,
  # ~3.6 Gi disponible et déjà du swap actif (mesuré via `free -h`).
  # Garder qwen3:latest (5.2 Go) chargé simultanément à llama3.2:3b (2 Go)
  # sur une fenêtre de 30m dépasserait la RAM dispo. "-1" = ne jamais
  # décharger — à proscrire ici tant que la RAM n'est pas augmentée.
  keep_alive: 10m

  ollama_max_connections: 50
  ollama_max_keepalive_connections: 10

  # Raisonnement interne des modeles « thinking » (qwen3 et suivants).
  # false sur cette machine : sans GPU, le debit mesure est de ~1 token/s, et
  # le budget partait entierement en reflexion invisible — 20 tokens generes
  # pour une reponse VIDE. Avec think desactive, le meme modele repond
  # « Bonjour! » en 3 tokens. A repasser a true sur un noeud dote d'un GPU.
  ollama_think: false

  # Plafond de tokens generes par reponse (0 = illimite).
  # Remis a 0 le 04/09/2026 apres mesure : avec `ollama_think: false`, le
  # modele s'arrete de lui-meme (12 tokens pour « Bonjour, comment puis-je
  # vous aider ? »). Le plafond de 40 tokens etait un pansement pose quand le
  # mode « thinking » devorait tout le budget — il etranglait le juge memoire,
  # qui doit produire un JSON de triplets et ne tenait pas en 40 tokens.
  ollama_num_predict: 0

  llama_cpp_host: http://127.0.0.1:8080
  llama_cpp_max_connections: 4
  llama_cpp_max_keepalive_connections: 2
  llama_cpp_n_predict: 64
  llama_cpp_temperature: 0.7

  llama_cpp_stop:
    - "</s>"
    - "User:"
    - "Assistant:"

  claude_max_tokens: 1024
  claude_max_connections: 20
  claude_max_keepalive_connections: 5

  temperature: 0.7

# ==================================================================
# TASKS — remplace les anciennes sections model_map / routing / strategy
# (fusionnées ici : un seul bloc par tâche, provider(s) + modèle + mode).
#
# 'providers' est une liste ordonnée :
#   - mode 'single'            → seul le premier élément est utilisé
#     (les suivants ne servent qu'en repli si le premier échoue).
#   - mode 'parallel' / 'race' → tous les éléments listés sont appelés,
#     et EUX SEULS (jamais un provider hors de cette liste).
# Chaque provider listé passe par llm.providers_allowed puis par la
# liste des providers réellement implémentés avant d'être utilisé ;
# sinon repli sur llm.safety_floor_provider.
# ==================================================================

tasks:
  code:
    providers: [ollama]
    model: qwen2.5-coder:1.5b  # au lieu de qwen2.5-coder:14b
    mode: single


  reasoning:
    providers: [ollama]
    model: qwen3:1.7b
    mode: single

  agent:
    providers: [ollama]
    model: qwen2.5-coder:1.5b  # au lieu de qwen2.5-coder:14b
    mode: single

  chat:
    providers: [ollama]
    # qwen3.5:9b (6,6 Go) ne tient pas sur cette machine : 7,2 Go de RAM
    # totale, ~4 Go disponibles, 2 coeurs, pas de GPU. Ollama le rechargeait
    # depuis le disque a chaque requete (keep_alive inoperant, le modele est
    # evince aussitot), d'ou du swap massif et des reponses qui n'arrivaient
    # jamais : 280 s sans reponse sur "/input/text", mesure le 03/09/2026.
    # Comme "chat" est le parcours le plus utilise, cette saturation
    # ralentissait tout Core et faisait echouer les sondes du Doctor.
    # qwen3:1.7b est aussi le modele de "reasoning" : un seul modele reste
    # charge en memoire pour les deux taches.
    model: qwen3:1.7b
    mode: single

  memory:
    providers: [ollama]
    # Aligne sur `chat` A DESSEIN. Chaque conversation declenche d'abord un
    # appel `memory` (contexte Oblivia) PUIS l'appel `chat` : avec deux
    # modeles differents, Ollama — qui ne traite qu'une generation a la fois —
    # devait permuter entre qwen3:4b-instruct (2,5 Go) et qwen3:1.7b (1,4 Go)
    # a chaque echange. Sur 2 coeurs et ~2 Go libres, les deux appels
    # expiraient l'un apres l'autre (ReadTimeout a 45 s chacun, mesure du
    # 03/09/2026), et ce meme avec le modele deja charge.
    # Un seul modele pour le couple memory+chat : plus de permutation.
    model: qwen3:1.7b
    mode: single

  fast:
    providers: [ollama]
    model: qwen3.5:4b
    mode: single

  summary:
    providers: [ollama]
    model: qwen3.5:4b
    mode: single

  default:
    providers: [ollama]
    model: qwen3.5:4b
    mode: single

# ==================================================================
# CODE AGENT
# ==================================================================

code_agent:
  enabled: true
  model: qwen2.5-coder:1.5b
  backup_count: 10
  sandbox_timeout: 10
  self_review_on_startup: false

# ==================================================================
# HOME ASSISTANT
# ==================================================================

home_assistant:
  enabled: true
  sync_interval: 60

# ==================================================================
# STT
# ==================================================================

stt:
  model: tiny
  language: fr
  device: cpu
  compute_type: int8

# ==================================================================
# LOGS
# ==================================================================

logs:
  dir: logs
  neron_log: neron.log
  watchdog_log: watchdog.log
  max_size_mb: 10
  backup_count: 5

# ==================================================================
# CORE
# ==================================================================

neron:
  api_key_env: NERON_API_KEY
  log_level: INFO

# ==================================================================
# SCHEDULER
# ==================================================================

scheduler:
  enabled: true
  daily_report_hour: 8
  generateur_hour: 2
  self_review_hour: 3
  memory_cleanup_days: 30

# ==================================================================
# TELEGRAM
# ==================================================================

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  notify_on_start: true

# ==================================================================
# TWILIO
# ==================================================================

twilio:
  enabled: true
  account_sid_env: TWILIO_ACCOUNT_SID
  auth_token_env: TWILIO_AUTH_TOKEN
  from_number_env: TWILIO_FROM_NUMBER
  to_number_env: TWILIO_TO_NUMBER

# ==================================================================
# WORKSPACE
# ==================================================================

workspace:
  path: /etc/neronOS/workspace
  generator_script: /etc/neronOS/workspace/generateur.py

# ==================================================================
# NEWS
# ==================================================================

news:
  country: fr
  max_headlines: 5

# ==================================================================
# WEATHER
# ==================================================================

weather:
  default_city: Paris

# ==================================================================
# DOCTOR
# ==================================================================

doctor:
  services:
    - neron@core
    - neron@llm
    - neron@goal
    - neron@memory
    - neron@voice
    - neron@doctor
    - neron@print
    - neron@gateways
    - ollama

# Lu par server/core/config.py (SERVER_HOST/SERVER_PORT/CORS_ORIGINS).
# Exception assumee a la regle « pas d infrastructure ici » : le Core ne lit
# pas neron.server.yaml pour le CORS, et `config.server_override` ci-dessus
# n est implemente par aucun chargeur. Voir la dette listee dans
# system/docs/architecture/neronos-architecture.md.
server:
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "https://homebox.tail7f8e60.ts.net:8443"
    - "http://homebox.tail7f8e60.ts.net:4400"
